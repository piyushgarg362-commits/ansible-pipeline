
---
- name: Deploy website to AWS EC2
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Install Nginx
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: Copy website to web server
      ansible.builtin.copy:
        src: index.html
        dest: /usr/share/nginx/html/index.html
        owner: root
        group: root
        mode: '0644'

    - name: Start and enable Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Verify Nginx is running
      ansible.builtin.service_facts:

    - name: Display deployment result
      ansible.builtin.debug:
        msg: "Website deployment completed on {{ inventory_hostname }}"

